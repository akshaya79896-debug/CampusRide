<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Rides & Bookings - CampusRide</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-nav" id="main-nav"></header>

  <main class="container" style="padding-top: 2.5rem; padding-bottom: 4rem;">
    <!-- Page Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
      <div>
        <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--dark); margin-bottom: 0.25rem;">My Rides & Requests</h1>
        <p style="color: var(--slate-500); font-size: 1rem;">Track rides you are offering and manage seat reservations you've requested.</p>
      </div>

      <div>
        <a href="offer-ride.html" class="btn btn-primary">➕ Offer a New Ride</a>
      </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-btn-offered">🚗 Rides I'm Offering</button>
      <button class="tab-btn" id="tab-btn-requests">🎫 My Seat Requests</button>
    </div>

    <!-- Tab 1: Rides I'm Offering -->
    <div id="tab-pane-offered">
      <div id="offered-rides-list" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="card" style="text-align: center; padding: 2.5rem;">
          <p>Loading your offered rides...</p>
        </div>
      </div>
    </div>

    <!-- Tab 2: My Seat Requests -->
    <div id="tab-pane-requests" style="display: none;">
      <div id="my-requests-list" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="card" style="text-align: center; padding: 2.5rem;">
          <p>Loading your booking requests...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!Auth.requireAuth()) return;

      UI.initNavbar("my-rides");
      UI.initFooter();

      const urlParams = new URLSearchParams(window.location.search);
      const initialTab = urlParams.get("tab") || "offered";

      const btnOffered = document.getElementById("tab-btn-offered");
      const btnRequests = document.getElementById("tab-btn-requests");
      const paneOffered = document.getElementById("tab-pane-offered");
      const paneRequests = document.getElementById("tab-pane-requests");

      function switchTab(tab) {
        if (tab === "requests") {
          btnRequests.classList.add("active");
          btnOffered.classList.remove("active");
          paneRequests.style.display = "block";
          paneOffered.style.display = "none";
          loadMyRequests();
        } else {
          btnOffered.classList.add("active");
          btnRequests.classList.remove("active");
          paneOffered.style.display = "block";
          paneRequests.style.display = "none";
          loadOfferedRides();
        }
      }

      btnOffered.addEventListener("click", () => switchTab("offered"));
      btnRequests.addEventListener("click", () => switchTab("requests"));

      switchTab(initialTab);

      // Load Offered Rides (Driver View)
      async function loadOfferedRides() {
        const container = document.getElementById("offered-rides-list");
        container.innerHTML = `<div class="card" style="text-align: center; padding: 2.5rem;"><p>Loading offered rides...</p></div>`;

        try {
          const res = await API.get("/rides/user/offered");
          if (res.success && res.rides) {
            const rides = res.rides;
            if (rides.length === 0) {
              container.innerHTML = `
                <div class="empty-state">
                  <div class="empty-icon">🚗</div>
                  <h3 class="empty-title">You haven't offered any rides</h3>
                  <p class="empty-desc">Share empty seats in your vehicle to help fellow students and split your commuting costs.</p>
                  <a href="offer-ride.html" class="btn btn-primary">Offer a Ride Now</a>
                </div>
              `;
              return;
            }

            container.innerHTML = rides.map(r => `
              <div class="card" style="padding: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
                  <div>
                    <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.35rem;">
                      ${UI.getVehicleBadge(r.vehicle_type)}
                      ${UI.getStatusBadge(r.status)}
                    </div>
                    <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--dark);">
                      ${r.source} ➔ ${r.destination}
                    </h3>
                  </div>
                  <div style="text-align: right;">
                    <div style="font-size: 1.4rem; font-weight: 800; color: var(--primary);">${UI.formatCurrency(r.fare)}</div>
                    <div style="font-size: 0.8rem; color: var(--slate-500);">per passenger</div>
                  </div>
                </div>

                <div class="ride-meta-grid" style="margin-bottom: 1rem;">
                  <div class="meta-item">
                    <span class="meta-label">Travel Date</span>
                    <span class="meta-value">${UI.formatDate(r.travel_date)}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Departure</span>
                    <span class="meta-value">${UI.formatTime(r.departure_time)}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Seats</span>
                    <span class="meta-value">${r.available_seats} of ${r.total_seats} available</span>
                  </div>
                </div>

                ${r.pending_requests_count > 0 ? `
                  <div style="background: var(--warning-light); border: 1px solid #FDE68A; border-radius: var(--radius-md); padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between;">
                    <span style="font-size: 0.9rem; font-weight: 700; color: #92400E;">
                      ⚠️ ${r.pending_requests_count} student(s) requested seats on this ride!
                    </span>
                    <a href="ride-details.html?id=${r.id}" class="btn btn-warning btn-sm" style="color: #92400E; background: #FEF3C7;">Review Requests</a>
                  </div>
                ` : ''}

                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--slate-100); padding-top: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                  <div style="font-size: 0.85rem; color: var(--slate-500);">
                    Confirmed Passengers: <strong>${r.accepted_requests_count || 0}</strong>
                  </div>
                  <div style="display: flex; gap: 0.5rem;">
                    <a href="ride-details.html?id=${r.id}" class="btn btn-secondary btn-sm">Manage Ride & Passengers</a>
                    ${r.status === 'OPEN' || r.status === 'FULL' ? `
                      <button class="btn btn-danger btn-sm btn-cancel-offered-ride" data-id="${r.id}">Cancel</button>
                    ` : ''}
                  </div>
                </div>
              </div>
            `).join("");

            // Cancel ride listeners
            document.querySelectorAll(".btn-cancel-offered-ride").forEach(b => {
              b.addEventListener("click", async () => {
                const confirmed = await UI.showConfirm({
                  title: "Cancel Offered Ride?",
                  message: "Are you sure you want to cancel this ride? All passengers will be alerted.",
                  confirmText: "Cancel Ride",
                  isDanger: true
                });
                if (confirmed) {
                  try {
                    const cRes = await API.patch(`/rides/${b.dataset.id}/cancel`);
                    if (cRes.success) {
                      UI.showToast("Ride cancelled.", "info");
                      loadOfferedRides();
                    }
                  } catch (e) {
                    UI.showToast(e.message || "Failed to cancel.", "error");
                  }
                }
              });
            });
          }
        } catch (err) {
          container.innerHTML = `<p style="color: var(--danger); text-align: center;">Error loading offered rides.</p>`;
        }
      }

      // Load My Seat Requests (Passenger View)
      async function loadMyRequests() {
        const container = document.getElementById("my-requests-list");
        container.innerHTML = `<div class="card" style="text-align: center; padding: 2.5rem;"><p>Loading seat requests...</p></div>`;

        try {
          const res = await API.get("/requests/my");
          if (res.success && res.requests) {
            const reqs = res.requests;
            if (reqs.length === 0) {
              container.innerHTML = `
                <div class="empty-state">
                  <div class="empty-icon">🎫</div>
                  <h3 class="empty-title">No seat requests yet</h3>
                  <p class="empty-desc">Find an open ride along your daily campus route and request a seat.</p>
                  <a href="rides.html" class="btn btn-primary">Find a Ride</a>
                </div>
              `;
              return;
            }

            container.innerHTML = reqs.map(q => `
              <div class="card" style="padding: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 0.75rem;">
                  <div>
                    <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.35rem;">
                      ${UI.getVehicleBadge(q.vehicle_type)}
                      ${UI.getStatusBadge(q.request_status)}
                    </div>
                    <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--dark);">
                      ${q.source} ➔ ${q.destination}
                    </h3>
                  </div>
                  <div style="text-align: right;">
                    <div style="font-size: 1.3rem; font-weight: 800; color: var(--primary);">${UI.formatCurrency(q.fare)}</div>
                    <div style="font-size: 0.8rem; color: var(--slate-500);">${q.seats_requested} seat(s) requested</div>
                  </div>
                </div>

                <div class="ride-meta-grid" style="margin-bottom: 1rem;">
                  <div class="meta-item">
                    <span class="meta-label">Date</span>
                    <span class="meta-value">${UI.formatDate(q.travel_date)}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Time</span>
                    <span class="meta-value">${UI.formatTime(q.departure_time)}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Driver</span>
                    <span class="meta-value">${q.driver_name}</span>
                  </div>
                </div>

                ${q.pickup_point ? `
                  <div style="font-size: 0.85rem; color: var(--slate-700); margin-bottom: 0.5rem;">
                    📍 <strong>Your Pickup Point:</strong> ${q.pickup_point}
                  </div>
                ` : ''}

                ${q.request_status === 'ACCEPTED' ? `
                  <div style="background: var(--accent-light); border: 1px solid #A7F3D0; border-radius: var(--radius-md); padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.9rem; color: #065F46;">
                    ✓ <strong>Seat Confirmed!</strong> Driver Phone: <strong>${q.driver_phone || 'Available in details'}</strong> (${q.driver_college || 'Student'})
                  </div>
                ` : ''}

                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--slate-100); padding-top: 0.75rem; flex-wrap: wrap; gap: 0.5rem;">
                  <span style="font-size: 0.8rem; color: var(--slate-500);">Requested on: ${new Date(q.request_date).toLocaleDateString()}</span>
                  <div style="display: flex; gap: 0.5rem;">
                    <a href="ride-details.html?id=${q.ride_id}" class="btn btn-secondary btn-sm">Ride Details</a>
                    ${q.request_status === 'PENDING' || q.request_status === 'ACCEPTED' ? `
                      <button class="btn btn-danger btn-sm btn-cancel-booking" data-id="${q.request_id}">Cancel Request</button>
                    ` : ''}
                  </div>
                </div>
              </div>
            `).join("");

            // Cancel booking listeners
            document.querySelectorAll(".btn-cancel-booking").forEach(b => {
              b.addEventListener("click", async () => {
                const confirmed = await UI.showConfirm({
                  title: "Cancel Booking Request?",
                  message: "Are you sure you want to cancel this seat reservation?",
                  confirmText: "Yes, Cancel",
                  isDanger: true
                });
                if (confirmed) {
                  try {
                    const cRes = await API.patch(`/requests/${b.dataset.id}/cancel`);
                    if (cRes.success) {
                      UI.showToast("Booking cancelled.", "info");
                      loadMyRequests();
                    }
                  } catch (e) {
                    UI.showToast(e.message || "Failed to cancel.", "error");
                  }
                }
              });
            });
          }
        } catch (err) {
          container.innerHTML = `<p style="color: var(--danger); text-align: center;">Error loading requests.</p>`;
        }
      }
    });
  </script>
</body>
</html>
