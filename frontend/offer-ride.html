<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer a Ride - CampusRide</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
</head>
<body style="background: var(--slate-100);">

  <!-- Navigation Bar -->
  <header class="site-nav" id="main-nav"></header>

  <main class="container" style="max-width: 680px; padding-top: 3rem; padding-bottom: 4rem;">
    <div class="card" style="padding: 2.5rem;">
      <div style="margin-bottom: 2rem;">
        <span class="badge badge-car" style="margin-bottom: 0.5rem;">Driver Form</span>
        <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--dark); margin-bottom: 0.35rem;">Offer Available Seats</h1>
        <p style="font-size: 0.95rem; color: var(--slate-500);">
          Travelling to campus? Share your empty seats, split travel costs, and commute with fellow students.
        </p>
      </div>

      <div id="offer-alert" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.9rem;"></div>

      <form id="offer-ride-form">
        <!-- Route details -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="offer-source">Starting Location <span class="required">*</span></label>
            <div class="input-icon-wrapper">
              <span class="input-icon">📍</span>
              <input type="text" id="offer-source" class="form-input" placeholder="e.g. Uppal Metro Station" list="sources-list" autocomplete="off" required>
              <datalist id="sources-list">
                <option value="Uppal Metro Station">
                <option value="LB Nagar Ring Road">
                <option value="Secunderabad Railway Station">
                <option value="Dilsukhnagar">
                <option value="KPHB Colony">
                <option value="Mehdipatnam">
                <option value="Tarnaka">
                <option value="Nagole Metro Station">
                <option value="Ghatkesar Town">
              </datalist>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="offer-destination">Destination College <span class="required">*</span></label>
            <div class="input-icon-wrapper">
              <span class="input-icon">🎓</span>
              <input type="text" id="offer-destination" class="form-input" placeholder="e.g. Anurag University, Ghatkesar" list="destinations-list" autocomplete="off" required>
              <datalist id="destinations-list">
                <option value="Anurag University, Ghatkesar">
                <option value="Osmania University Campus">
                <option value="JNTU Hyderabad">
                <option value="CBIT Gandipet">
                <option value="VNR VJIET">
                <option value="GRIET Bachupally">
                <option value="CVR College of Engineering">
              </datalist>
            </div>
          </div>
        </div>

        <!-- Date & Time -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="offer-date">Travel Date <span class="required">*</span></label>
            <input type="date" id="offer-date" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="offer-time">Departure Time <span class="required">*</span></label>
            <input type="time" id="offer-time" class="form-input" required>
          </div>
        </div>

        <!-- Vehicle Type Selector -->
        <div class="form-group">
          <label class="form-label">Vehicle Type <span class="required">*</span></label>
          <div class="vehicle-selector">
            <label class="vehicle-option" id="opt-bike">
              <input type="radio" name="vehicle_type" value="Bike" checked>
              <span class="vehicle-option-icon">🏍️</span>
              <span class="vehicle-option-title">Bike</span>
              <span class="vehicle-option-hint">1 passenger</span>
            </label>

            <label class="vehicle-option" id="opt-car">
              <input type="radio" name="vehicle_type" value="Car">
              <span class="vehicle-option-icon">🚗</span>
              <span class="vehicle-option-title">Car</span>
              <span class="vehicle-option-hint">1-4 passengers</span>
            </label>

            <label class="vehicle-option" id="opt-auto">
              <input type="radio" name="vehicle_type" value="Auto">
              <span class="vehicle-option-icon">🛺</span>
              <span class="vehicle-option-title">Auto</span>
              <span class="vehicle-option-hint">1-3 passengers</span>
            </label>
          </div>
        </div>

        <!-- Vehicle Details (Model, Plate) -->
        <div class="form-group">
          <label class="form-label" for="offer-vehicle-details">Vehicle Model & Plate Number (Optional)</label>
          <input type="text" id="offer-vehicle-details" class="form-input" placeholder="e.g. Royal Enfield Classic 350 (TS08EA1234)">
          <span class="form-hint">Helps students recognize your vehicle at the pickup point.</span>
        </div>

        <!-- Seats & Fare -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="offer-seats">Passenger Seats Available <span class="required">*</span></label>
            <input type="number" id="offer-seats" class="form-input" min="1" max="6" value="1" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="offer-fare">Fare per Passenger (₹) <span class="required">*</span></label>
            <div class="input-icon-wrapper">
              <span class="input-icon">₹</span>
              <input type="number" id="offer-fare" class="form-input" min="0" max="500" step="5" value="40" required>
            </div>
            <span class="form-hint">Set fair student-friendly fuel share cost.</span>
          </div>
        </div>

        <!-- Notes -->
        <div class="form-group">
          <label class="form-label" for="offer-notes">Route Notes & Instructions (Optional)</label>
          <textarea id="offer-notes" class="form-textarea" rows="3" placeholder="e.g. Travelling daily for 9:00 AM class. Pickup near Metro Gate 2. Please carry a helmet."></textarea>
        </div>

        <button type="submit" id="offer-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          Publish Ride Listing
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Guard page: authentication required
      if (!Auth.requireAuth()) return;

      UI.initNavbar("offer");
      UI.initFooter();

      // Set min date to today
      const todayStr = new Date().toISOString().split("T")[0];
      const dateInput = document.getElementById("offer-date");
      dateInput.min = todayStr;
      dateInput.value = todayStr;

      // Set default time to next full hour
      const now = new Date();
      now.setHours(now.getHours() + 1);
      const hours = String(now.getHours()).padStart(2, "0");
      document.getElementById("offer-time").value = `${hours}:00`;

      // Vehicle selection radio handling
      const vehicleRadios = document.querySelectorAll('input[name="vehicle_type"]');
      const seatsInput = document.getElementById("offer-seats");

      function updateVehicleSelection() {
        document.querySelectorAll(".vehicle-option").forEach(opt => opt.classList.remove("selected"));
        const checked = document.querySelector('input[name="vehicle_type"]:checked');
        if (checked) {
          checked.closest(".vehicle-option").classList.add("selected");
          if (checked.value === "Bike") {
            seatsInput.value = 1;
            seatsInput.max = 1;
          } else if (checked.value === "Auto") {
            seatsInput.value = 3;
            seatsInput.max = 3;
          } else if (checked.value === "Car") {
            seatsInput.value = 3;
            seatsInput.max = 6;
          }
        }
      }

      vehicleRadios.forEach(r => r.addEventListener("change", updateVehicleSelection));
      updateVehicleSelection();

      // Form Submission
      const form = document.getElementById("offer-ride-form");
      const alertBox = document.getElementById("offer-alert");
      const submitBtn = document.getElementById("offer-submit-btn");

      function showAlert(msg) {
        alertBox.textContent = msg;
        alertBox.style.display = "block";
        alertBox.style.background = "var(--danger-light)";
        alertBox.style.color = "#991B1B";
        alertBox.style.border = "1px solid #FECACA";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        const source = document.getElementById("offer-source").value.trim();
        const destination = document.getElementById("offer-destination").value.trim();
        const travel_date = document.getElementById("offer-date").value;
        const departure_time = document.getElementById("offer-time").value;
        const vehicle_type = document.querySelector('input[name="vehicle_type"]:checked').value;
        const vehicle_details = document.getElementById("offer-vehicle-details").value.trim();
        const total_seats = parseInt(document.getElementById("offer-seats").value);
        const fare = parseFloat(document.getElementById("offer-fare").value);
        const notes = document.getElementById("offer-notes").value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = "Publishing Ride...";

        try {
          const res = await API.post("/rides", {
            source,
            destination,
            travel_date,
            departure_time,
            vehicle_type,
            vehicle_details,
            total_seats,
            available_seats: total_seats,
            fare,
            notes
          });

          if (res.success) {
            UI.showToast("Your ride was published successfully!", "success");
            setTimeout(() => {
              window.location.href = "my-rides.html?tab=offered";
            }, 800);
          }
        } catch (err) {
          showAlert(err.message || "Failed to publish ride. Please check details.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Publish Ride Listing";
        }
      });
    });
  </script>
</body>
</html>
