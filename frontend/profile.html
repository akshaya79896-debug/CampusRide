<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile & Reviews - CampusRide</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-nav" id="main-nav"></header>

  <main class="container" style="max-width: 850px; padding-top: 2.5rem; padding-bottom: 4rem;">
    <!-- Profile Header Card -->
    <div class="card" style="padding: 2rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
      <div class="avatar-circle" id="prof-avatar" style="width: 4.5rem; height: 4.5rem; font-size: 2rem;">
        U
      </div>
      <div style="flex: 1;">
        <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--dark); margin-bottom: 0.25rem;" id="prof-display-name">
          Loading...
        </h1>
        <p style="color: var(--slate-500); font-size: 0.95rem;">
          <span id="prof-display-college">Campus</span> &bull; <span id="prof-display-email">email</span>
        </p>
        <div style="display: flex; gap: 0.75rem; margin-top: 0.75rem; align-items: center;">
          <span class="badge badge-success" id="prof-role-badge">STUDENT</span>
          <span style="font-weight: 700; color: #D97706; font-size: 0.95rem;" id="prof-avg-rating">★ New</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;" id="profile-forms-grid">
      <!-- Update Profile Info Form -->
      <div class="card" style="padding: 1.75rem;">
        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem;">✏️ Edit Profile</h2>
        <form id="profile-info-form">
          <div class="form-group">
            <label class="form-label" for="edit-name">Full Name <span class="required">*</span></label>
            <input type="text" id="edit-name" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-phone">Phone / WhatsApp Number</label>
            <input type="tel" id="edit-phone" class="form-input" placeholder="e.g. 9876543210">
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-college">College / University</label>
            <input type="text" id="edit-college" class="form-input" placeholder="e.g. Anurag University">
          </div>

          <button type="submit" id="btn-save-profile" class="btn btn-primary btn-block">
            Save Changes
          </button>
        </form>
      </div>

      <!-- Change Password Form -->
      <div class="card" style="padding: 1.75rem;">
        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem;">🔒 Change Password</h2>
        <form id="change-password-form">
          <div class="form-group">
            <label class="form-label" for="curr-password">Current Password <span class="required">*</span></label>
            <input type="password" id="curr-password" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="new-password">New Password <span class="required">*</span></label>
            <input type="password" id="new-password" class="form-input" minlength="6" placeholder="Min 6 characters" required>
          </div>

          <button type="submit" id="btn-change-pass" class="btn btn-secondary btn-block">
            Update Password
          </button>
        </form>
      </div>
    </div>

    <!-- Student Reviews & Ratings Section -->
    <div class="card" style="padding: 1.75rem;">
      <h2 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 0.5rem;">🌟 Student Reviews & Feedback</h2>
      <p style="font-size: 0.9rem; color: var(--slate-500); margin-bottom: 1.5rem;">Ratings given by fellow peers for rides completed together.</p>

      <div id="user-reviews-container">
        <p style="text-align: center; color: var(--slate-500); padding: 1.5rem 0;">Loading reviews...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!Auth.requireAuth()) return;

      UI.initNavbar("profile");
      UI.initFooter();

      let currentUserId = null;

      // Load Profile
      try {
        const res = await API.get("/auth/me");
        if (res.success && res.user) {
          const u = res.user;
          currentUserId = u.id;

          document.getElementById("prof-avatar").textContent = u.name ? u.name.charAt(0).toUpperCase() : "U";
          document.getElementById("prof-display-name").textContent = u.name;
          document.getElementById("prof-display-college").textContent = u.college || "Campus Member";
          document.getElementById("prof-display-email").textContent = u.email;
          document.getElementById("prof-role-badge").textContent = u.role;

          document.getElementById("edit-name").value = u.name || "";
          document.getElementById("edit-phone").value = u.phone || "";
          document.getElementById("edit-college").value = u.college || "";

          if (u.stats && u.stats.avgRating) {
            document.getElementById("prof-avg-rating").textContent = u.stats.avgRating === "New" ? "★ New (No reviews yet)" : `★ ${u.stats.avgRating} (${u.stats.totalRatings} reviews)`;
          }

          loadReviews(u.id);
        }
      } catch (e) {
        console.error("Profile load error:", e);
      }

      // Load reviews
      async function loadReviews(userId) {
        const container = document.getElementById("user-reviews-container");
        try {
          const rRes = await API.get(`/ratings/user/${userId}`);
          if (rRes.success && rRes.reviews && rRes.reviews.length > 0) {
            container.innerHTML = `
              <div style="display: flex; flex-direction: column; gap: 1rem;">
                ${rRes.reviews.map(rw => `
                  <div style="border-bottom: 1px solid var(--slate-100); padding-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
                      <div>
                        <strong>${rw.reviewer_name}</strong>
                        <span style="color: #D97706; margin-left: 0.5rem; font-weight: 700;">${'★'.repeat(rw.rating)}</span>
                      </div>
                      <span style="font-size: 0.8rem; color: var(--slate-400);">${new Date(rw.created_at).toLocaleDateString()}</span>
                    </div>
                    <p style="font-size: 0.925rem; color: var(--slate-700); margin-bottom: 0.25rem;">
                      "${rw.review || 'Great ride!'}"
                    </p>
                    <span style="font-size: 0.75rem; color: var(--slate-400);">Ride: ${rw.source} ➔ ${rw.destination}</span>
                  </div>
                `).join("")}
              </div>
            `;
          } else {
            container.innerHTML = `
              <div style="text-align: center; padding: 1.5rem 0; color: var(--slate-500);">
                No reviews yet. Complete a ride to start collecting community ratings!
              </div>
            `;
          }
        } catch (err) {
          container.innerHTML = `<p style="color: var(--danger);">Failed to load reviews.</p>`;
        }
      }

      // Save Profile Edit
      document.getElementById("profile-info-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-save-profile");
        const name = document.getElementById("edit-name").value.trim();
        const phone = document.getElementById("edit-phone").value.trim();
        const college = document.getElementById("edit-college").value.trim();

        btn.disabled = true;
        btn.textContent = "Saving...";

        try {
          const res = await API.put("/auth/profile", { name, phone, college });
          if (res.success) {
            Auth.setSession(null, res.user);
            UI.showToast("Profile updated successfully!", "success");
            document.getElementById("prof-display-name").textContent = res.user.name;
            document.getElementById("prof-display-college").textContent = res.user.college;
          }
        } catch (err) {
          UI.showToast(err.message || "Failed to update profile.", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Save Changes";
        }
      });

      // Change Password
      document.getElementById("change-password-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-change-pass");
        const currentPassword = document.getElementById("curr-password").value;
        const newPassword = document.getElementById("new-password").value;

        btn.disabled = true;
        btn.textContent = "Updating...";

        try {
          const res = await API.put("/auth/change-password", { currentPassword, newPassword });
          if (res.success) {
            UI.showToast("Password updated successfully!", "success");
            document.getElementById("change-password-form").reset();
          }
        } catch (err) {
          UI.showToast(err.message || "Failed to change password.", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Update Password";
        }
      });
    });
  </script>
</body>
</html>
