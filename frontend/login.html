<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - CampusRide</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
</head>
<body style="background: var(--slate-100);">

  <!-- Navigation Bar -->
  <header class="site-nav" id="main-nav"></header>

  <div class="container" style="max-width: 480px; padding-top: 3.5rem; padding-bottom: 3.5rem;">
    <div class="card" style="padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span style="font-size: 2.5rem; display: inline-block; margin-bottom: 0.5rem;">🔐</span>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--dark); margin-bottom: 0.35rem;">Welcome Back</h1>
        <p style="font-size: 0.95rem; color: var(--slate-500);">Log in to manage your rides, bookings, and seat requests.</p>
      </div>

      <div id="login-alert" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.9rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="login-email" class="form-input" placeholder="e.g. akshaya@gmail.com" required>
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password <span class="required">*</span></label>
          </div>
          <div class="input-icon-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="login-password" class="form-input" placeholder="Your password" required>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.75rem;">
          Log In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--slate-600);">
        Don't have an account yet? <a href="register.html" style="font-weight: 700;">Create free account</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer" id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      UI.initNavbar("login");
      UI.initFooter();

      // Check URL parameters (redirect, session_expired)
      const urlParams = new URLSearchParams(window.location.search);
      const alertBox = document.getElementById("login-alert");

      if (urlParams.get("session_expired")) {
        alertBox.textContent = "Your session has expired. Please log in again.";
        alertBox.style.display = "block";
        alertBox.style.background = "var(--warning-light)";
        alertBox.style.color = "#92400E";
        alertBox.style.border = "1px solid #FDE68A";
      }

      const form = document.getElementById("login-form");
      const submitBtn = document.getElementById("login-submit-btn");

      function showAlert(msg) {
        alertBox.textContent = msg;
        alertBox.style.display = "block";
        alertBox.style.background = "var(--danger-light)";
        alertBox.style.color = "#991B1B";
        alertBox.style.border = "1px solid #FECACA";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        try {
          const res = await API.post("/auth/login", { email, password });
          if (res.success && res.token) {
            Auth.setSession(res.token, res.user);
            UI.showToast("Logged in successfully!", "success");

            // Redirect to destination or dashboard
            const redirect = urlParams.get("redirect");
            setTimeout(() => {
              if (redirect) {
                window.location.href = decodeURIComponent(redirect);
              } else if (res.user.role === "ADMIN") {
                window.location.href = "admin.html";
              } else {
                window.location.href = "dashboard.html";
              }
            }, 600);
          }
        } catch (err) {
          showAlert(err.message || "Invalid email or password.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Log In";
        }
      });
    });
  </script>
</body>
</html>
