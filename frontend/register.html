<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - CampusRide</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
</head>
<body style="background: var(--slate-100);">

  <!-- Navigation Bar -->
  <header class="site-nav" id="main-nav"></header>

  <div class="container" style="max-width: 520px; padding-top: 3rem; padding-bottom: 3rem;">
    <div class="card" style="padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span style="font-size: 2.5rem; display: inline-block; margin-bottom: 0.5rem;">🎓</span>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--dark); margin-bottom: 0.35rem;">Join CampusRide</h1>
        <p style="font-size: 0.95rem; color: var(--slate-500);">Connect with peers, share rides, and save on campus travel.</p>
      </div>

      <div id="register-alert" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.9rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. Rahul Sharma" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">College / Personal Email <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="reg-email" class="form-input" placeholder="e.g. rahul@anurag.edu.in or gmail.com" required>
          </div>
          <span class="form-hint">Used for your account login and ride updates.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" minlength="6" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Phone / WhatsApp Number <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <span class="input-icon">📱</span>
            <input type="tel" id="reg-phone" class="form-input" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required>
          </div>
          <span class="form-hint">Shared with confirmed ride partners for coordination.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-college">College / University <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <span class="input-icon">🏛️</span>
            <input type="text" id="reg-college" class="form-input" placeholder="e.g. Anurag University" list="colleges-list" required>
            <datalist id="colleges-list">
              <option value="Anurag University, Ghatkesar">
              <option value="Osmania University Campus">
              <option value="JNTU Hyderabad">
              <option value="CBIT Gandipet">
              <option value="VNR VJIET">
              <option value="Gokaraju Rangaraju (GRIET)">
              <option value="CVR College of Engineering">
              <option value="Vasavi College of Engineering">
            </datalist>
          </div>
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          Create Free Student Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--slate-600);">
        Already have an account? <a href="login.html" style="font-weight: 700;">Log In here</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer" id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      UI.initNavbar("register");
      UI.initFooter();

      // If already logged in, redirect to dashboard
      if (Auth.isLoggedIn()) {
        window.location.href = "dashboard.html";
        return;
      }

      const form = document.getElementById("register-form");
      const alertBox = document.getElementById("register-alert");
      const submitBtn = document.getElementById("reg-submit-btn");

      function showAlert(msg, isSuccess = false) {
        alertBox.textContent = msg;
        alertBox.style.display = "block";
        if (isSuccess) {
          alertBox.style.background = "var(--accent-light)";
          alertBox.style.color = "#065F46";
          alertBox.style.border = "1px solid #A7F3D0";
        } else {
          alertBox.style.background = "var(--danger-light)";
          alertBox.style.color = "#991B1B";
          alertBox.style.border = "1px solid #FECACA";
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-password").value;
        const phone = document.getElementById("reg-phone").value.trim();
        const college = document.getElementById("reg-college").value.trim();

        if (password.length < 6) {
          showAlert("Password must be at least 6 characters.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating Account...";

        try {
          const res = await API.post("/auth/register", {
            name,
            email,
            password,
            phone,
            college
          });

          if (res.success) {
            showAlert("Account created successfully! Redirecting...", true);
            Auth.setSession(res.token, res.user);
            UI.showToast("Welcome to CampusRide!", "success");
            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 1000);
          }
        } catch (err) {
          showAlert(err.message || "Failed to create account. Please check your inputs.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Create Free Student Account";
        }
      });
    });
  </script>
</body>
</html>
