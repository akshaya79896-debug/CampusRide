<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - CampusRide</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-nav" id="main-nav"></header>

  <main class="container" style="max-width: 800px; padding-top: 2.5rem; padding-bottom: 4rem;">
    <!-- Page Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
      <div>
        <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--dark); margin-bottom: 0.25rem;">Notifications</h1>
        <p style="color: var(--slate-500); font-size: 0.95rem;">Real-time alerts for ride requests, confirmations, and campus commute updates.</p>
      </div>

      <div>
        <button id="btn-mark-all-read" class="btn btn-secondary btn-sm">
          ✓ Mark All as Read
        </button>
      </div>
    </div>

    <!-- Notification List Container -->
    <div class="card" style="padding: 1.5rem;">
      <div id="notifications-list">
        <p style="text-align: center; color: var(--slate-500); padding: 2rem 0;">Loading notifications...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!Auth.requireAuth()) return;

      UI.initNavbar("notifications");
      UI.initFooter();

      loadNotifications();

      // Mark all read button
      document.getElementById("btn-mark-all-read").addEventListener("click", async () => {
        try {
          const res = await API.patch("/notifications/read-all");
          if (res.success) {
            UI.showToast("All notifications marked as read.", "success");
            loadNotifications();
            UI.updateNotificationBadge();
          }
        } catch (e) {
          UI.showToast("Failed to mark notifications.", "error");
        }
      });
    });

    async function loadNotifications() {
      const container = document.getElementById("notifications-list");

      try {
        const res = await API.get("/notifications");
        if (res.success && res.notifications) {
          const list = res.notifications;
          if (list.length === 0) {
            container.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">🔔</div>
                <h3 class="empty-title">You're all caught up!</h3>
                <p class="empty-desc">No new notifications right now. Alerts for booking confirmations or ride requests will appear here.</p>
              </div>
            `;
            return;
          }

          container.innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 0.85rem;">
              ${list.map(n => {
                let icon = "🔔";
                let borderCol = "var(--primary)";
                if (n.type === "REQUEST_ACCEPTED") { icon = "🎉"; borderCol = "var(--accent)"; }
                if (n.type === "REQUEST_RECEIVED") { icon = "📩"; borderCol = "var(--warning)"; }
                if (n.type === "REQUEST_REJECTED") { icon = "❌"; borderCol = "var(--danger)"; }
                if (n.type === "RIDE_CANCELLED") { icon = "⚠️"; borderCol = "var(--danger)"; }

                return `
                  <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 1rem; border-radius: var(--radius-md); border-left: 4px solid ${borderCol}; background: ${n.is_read ? 'var(--white)' : 'var(--primary-light)'}; border-top: 1px solid var(--slate-100); border-right: 1px solid var(--slate-100); border-bottom: 1px solid var(--slate-100);">
                    <div style="display: flex; gap: 0.85rem; align-items: flex-start;">
                      <span style="font-size: 1.5rem;">${icon}</span>
                      <div>
                        <div style="font-weight: 700; font-size: 0.95rem; color: var(--dark); margin-bottom: 0.2rem;">
                          ${n.title}
                          ${!n.is_read ? '<span style="display: inline-block; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; margin-left: 0.35rem;"></span>' : ''}
                        </div>
                        <p style="font-size: 0.9rem; color: var(--slate-700); line-height: 1.4; margin-bottom: 0.4rem;">
                          ${n.message}
                        </p>
                        <div style="font-size: 0.75rem; color: var(--slate-400);">
                          ${new Date(n.created_at).toLocaleString()}
                        </div>
                      </div>
                    </div>

                    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; flex-shrink: 0;">
                      ${n.related_ride_id ? `
                        <a href="ride-details.html?id=${n.related_ride_id}" class="btn btn-secondary btn-sm" style="font-size: 0.8rem; padding: 0.25rem 0.6rem;">
                          View Ride
                        </a>
                      ` : ''}
                      ${!n.is_read ? `
                        <button class="btn btn-outline btn-sm btn-mark-read" data-id="${n.id}" style="font-size: 0.75rem; padding: 0.2rem 0.5rem;">
                          Mark read
                        </button>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `;

          // Mark single read listeners
          document.querySelectorAll(".btn-mark-read").forEach(b => {
            b.addEventListener("click", async () => {
              try {
                await API.patch(`/notifications/${b.dataset.id}/read`);
                loadNotifications();
                UI.updateNotificationBadge();
              } catch (e) {
                // ignore
              }
            });
          });

        }
      } catch (err) {
        container.innerHTML = `<p style="color: var(--danger); text-align: center;">Error loading notifications.</p>`;
      }
    }
  </script>
</body>
</html>
